<!doctype html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menonton: Miracle in Cell No. 7 - LayarKu</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    .overlay-atas {
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent);
    }
    .overlay-bawah {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
    }
    .overlay-atas,
    .overlay-bawah {
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    .player-idle .overlay-atas,
    .player-idle .overlay-bawah {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .player-idle {
      cursor: none;
    }
    .slider-volume {
      width: 80px;
    }
  </style>
</head>
<body class="bg-black text-white">

  <div id="wadahPemutar" class="position-relative min-vh-100 d-flex align-items-center justify-content-center bg-black">

    <!-- Bagian Atas: Tombol Kembali dan Judul Film -->
    <div class="overlay-atas position-fixed top-0 start-0 end-0 z-3 p-3 d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a href="detail-film.html" class="btn btn-outline-light btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Kembali
        </a>
        <div>
          <div class="fw-bold">Miracle in Cell No. 7</div>
          <small class="text-secondary">2022 &bull; Drama, Komedi</small>
        </div>
      </div>
      <span class="text-danger fw-bold fs-5 d-none d-md-inline">LayarKu</span>
    </div>

    <!-- Video Utama -->
    <video
      id="videoFilm"
      class="w-100 vh-100 object-fit-contain"
      poster="img/poster2.jpeg"
      preload="metadata"
      playsinline>
      <source src="video/trailer-miracle.mp4" type="video/mp4">
      Browser Anda tidak mendukung pemutar video.
    </video>

    <!-- Bagian Bawah: Kontrol Pemutar -->
    <div class="overlay-bawah position-fixed bottom-0 start-0 end-0 z-3 p-3">
      <!-- Baris Waktu / Seek -->
      <div class="mb-2">
        <label for="barWaktu" class="visually-hidden">Geser posisi video</label>
        <input type="range" id="barWaktu" class="form-range" min="0" max="100" value="0" step="0.1">
      </div>

      <!-- Baris Tombol Kontrol -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">

        <!-- Kiri: Play/Pause, Mundur/Maju 10 Detik, Volume, Durasi -->
        <div class="d-flex align-items-center gap-2">
          <button type="button" id="tombolPlay" class="btn btn-danger btn-sm">
            <i id="ikonPlay" class="bi bi-play-fill"></i>
          </button>

          <button type="button" id="tombolMundur" class="btn btn-outline-light btn-sm" title="Mundur 10 detik">
            <i class="bi bi-arrow-counterclockwise"></i> 10s
          </button>

          <button type="button" id="tombolMaju" class="btn btn-outline-light btn-sm" title="Maju 10 detik">
            <i class="bi bi-arrow-clockwise"></i> 10s
          </button>

          <button type="button" id="tombolSuara" class="btn btn-outline-secondary btn-sm text-white">
            <i id="ikonSuara" class="bi bi-volume-up-fill"></i>
          </button>

          <label for="barVolume" class="visually-hidden">Atur volume</label>
          <input type="range" id="barVolume" class="form-range slider-volume mb-0" min="0" max="1" step="0.05" value="1">

          <small id="teksWaktu" class="text-light ms-2">00:00 / 00:00</small>
        </div>

        <!-- Kanan: Subtitle, Kualitas, Layar Penuh -->
        <div class="d-flex align-items-center gap-2">
          <!-- Pilihan Subtitle -->
          <div class="dropdown">
            <button class="btn btn-dark btn-sm border-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-badge-cc me-1"></i><span id="labelSubtitle">ID</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
              <li><button class="dropdown-item pilih-subtitle" data-sub="ID" type="button">Indonesia</button></li>
              <li><button class="dropdown-item pilih-subtitle" data-sub="EN" type="button">English</button></li>
              <li><button class="dropdown-item pilih-subtitle" data-sub="OFF" type="button">Nonaktif</button></li>
            </ul>
          </div>

          <!-- Pilihan Kualitas -->
          <div class="dropdown">
            <button class="btn btn-dark btn-sm border-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
              <i class="bi bi-gear me-1"></i><span id="labelKualitas">1080p</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
              <li><button class="dropdown-item pilih-kualitas" data-qual="1080p" type="button">1080p Full HD</button></li>
              <li><button class="dropdown-item pilih-kualitas" data-qual="720p" type="button">720p HD</button></li>
              <li><button class="dropdown-item pilih-kualitas" data-qual="480p" type="button">480p SD</button></li>
            </ul>
          </div>

          <!-- Layar Penuh -->
          <button type="button" id="tombolLayarPenuh" class="btn btn-outline-light btn-sm" title="Layar penuh">
            <i id="ikonLayarPenuh" class="bi bi-arrows-fullscreen"></i>
          </button>
        </div>

      </div>
    </div>

  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script>
    const wadahPemutar = document.getElementById('wadahPemutar');
    const video = document.getElementById('videoFilm');
    const tombolPlay = document.getElementById('tombolPlay');
    const ikonPlay = document.getElementById('ikonPlay');
    const tombolMundur = document.getElementById('tombolMundur');
    const tombolMaju = document.getElementById('tombolMaju');
    const tombolSuara = document.getElementById('tombolSuara');
    const ikonSuara = document.getElementById('ikonSuara');
    const barVolume = document.getElementById('barVolume');
    const barWaktu = document.getElementById('barWaktu');
    const teksWaktu = document.getElementById('teksWaktu');
    const labelSubtitle = document.getElementById('labelSubtitle');
    const labelKualitas = document.getElementById('labelKualitas');
    const tombolLayarPenuh = document.getElementById('tombolLayarPenuh');
    const ikonLayarPenuh = document.getElementById('ikonLayarPenuh');

    // Sembunyikan kontrol saat pengguna diam, tampilkan lagi saat di-hover / digerakkan
    let timerDiam;
    function tampilkanKontrol() {
      wadahPemutar.classList.remove('player-idle');
      clearTimeout(timerDiam);
      timerDiam = setTimeout(() => {
        const adaDropdownTerbuka = document.querySelector('.dropdown-menu.show');
        if (!adaDropdownTerbuka) {
          wadahPemutar.classList.add('player-idle');
        }
      }, 2500);
    }

    ['mousemove', 'mouseenter', 'pointermove', 'touchstart', 'keydown'].forEach(eventName => {
      wadahPemutar.addEventListener(eventName, tampilkanKontrol, { passive: true });
    });

    wadahPemutar.addEventListener('mouseleave', () => {
      clearTimeout(timerDiam);
      const adaDropdownTerbuka = document.querySelector('.dropdown-menu.show');
      if (!adaDropdownTerbuka) {
        wadahPemutar.classList.add('player-idle');
      }
    });

    document.addEventListener('hidden.bs.dropdown', tampilkanKontrol);
    tampilkanKontrol();

    // Mengubah detik menjadi format MM:SS
    function formatMenitDetik(detik) {
      if (!Number.isFinite(detik) || detik < 0) {
        return '00:00';
      }
      const menit = Math.floor(detik / 60);
      const sisaDetik = Math.floor(detik % 60);
      return String(menit).padStart(2, '0') + ':' + String(sisaDetik).padStart(2, '0');
    }

    // Putar atau jeda video
    function putarAtauJeda() {
      if (video.paused) {
        video.play().catch(() => {});
      } else {
        video.pause();
      }
    }

    tombolPlay.addEventListener('click', putarAtauJeda);
    video.addEventListener('click', putarAtauJeda);

    video.addEventListener('play', () => {
      ikonPlay.className = 'bi bi-pause-fill';
    });

    video.addEventListener('pause', () => {
      ikonPlay.className = 'bi bi-play-fill';
    });

    // Mundur dan maju 10 detik
    tombolMundur.addEventListener('click', () => {
      video.currentTime = Math.max(0, video.currentTime - 10);
    });

    tombolMaju.addEventListener('click', () => {
      if (Number.isFinite(video.duration)) {
        video.currentTime = Math.min(video.duration, video.currentTime + 10);
      }
    });

    // Bisukan / nyalakan suara dan atur volume
    tombolSuara.addEventListener('click', () => {
      video.muted = !video.muted;
      barVolume.value = video.muted ? 0 : video.volume;
      ikonSuara.className = video.muted ? 'bi bi-volume-mute-fill' : 'bi bi-volume-up-fill';
    });

    barVolume.addEventListener('input', () => {
      video.volume = parseFloat(barVolume.value);
      video.muted = video.volume === 0;
      ikonSuara.className = video.muted ? 'bi bi-volume-mute-fill' : 'bi bi-volume-up-fill';
    });

    // Perbarui tampilan durasi dan slider saat video berjalan
    video.addEventListener('loadedmetadata', () => {
      teksWaktu.textContent = '00:00 / ' + formatMenitDetik(video.duration);
    });

    video.addEventListener('timeupdate', () => {
      if (Number.isFinite(video.duration) && video.duration > 0) {
        barWaktu.value = (video.currentTime / video.duration) * 100;
        teksWaktu.textContent = formatMenitDetik(video.currentTime) + ' / ' + formatMenitDetik(video.duration);
      }
    });

    // Geser posisi video lewat bar waktu
    barWaktu.addEventListener('input', () => {
      if (Number.isFinite(video.duration) && video.duration > 0) {
        video.currentTime = (parseFloat(barWaktu.value) / 100) * video.duration;
      }
    });

    // Ganti label subtitle (tanpa memunculkan teks subtitle di layar)
    document.querySelectorAll('.pilih-subtitle').forEach(item => {
      item.addEventListener('click', () => {
        labelSubtitle.textContent = item.dataset.sub;
      });
    });

    // Ganti label kualitas video
    document.querySelectorAll('.pilih-kualitas').forEach(item => {
      item.addEventListener('click', () => {
        labelKualitas.textContent = item.dataset.qual;
      });
    });

    // Mode layar penuh
    tombolLayarPenuh.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    document.addEventListener('fullscreenchange', () => {
      ikonLayarPenuh.className = document.fullscreenElement
        ? 'bi bi-fullscreen-exit'
        : 'bi bi-arrows-fullscreen';
    });
  </script>
</body>
</html>
