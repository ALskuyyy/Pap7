<!doctype html>
<html lang="id" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pencarian Film - LayarKu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-dark sticky-top shadow">
    <div class="container">
      <img src="img/LogoLayarku.jpg" class="float-start me-3 mb-2" alt="Logo" width="44" height="44">
      <a class="navbar-brand fs-4 text-danger fw-bold" href="index.html">LayarKu</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuUtama"
        aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuUtama">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item">
            <form action="pencarian.html" method="get" class="navbar-search" role="search">
              <input class="form-control form-control-sm" type="search" name="q" placeholder="Cari film atau serial..."
                aria-label="Cari film atau serial">
            </form>
          </li>
          <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="film.html">Film</a></li>
          <li class="nav-item"><a class="nav-link" href="serial.html">Serial</a></li>
          <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="kontak.html">Kontak</a></li>
          <li class="nav-item"><a href="login.html" class="btn btn-outline-danger btn-md">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <button id="backButton" class="btn btn-outline-light btn-sm mb-3" type="button">Kembali</button>
    <h1 class="h3 border-start border-danger border-4 ps-3 mb-3">Cari Film</h1>
    <p class="text-secondary mb-4">Cari berdasarkan judul, genre, atau tahun rilis.</p>
    <form action="pencarian.html" method="get" id="searchForm" class="row g-2 mb-4" role="search">
      <div class="col-sm">
        <label for="filmKeyword" class="visually-hidden">Kata kunci film</label>
        <input id="filmKeyword" class="form-control" type="search" name="q" placeholder="Contoh: komedi, Miracle, 2024"
          autocomplete="off">
      </div>
      <div class="col-sm-auto">
        <button class="btn btn-danger w-100" type="submit">Cari</button>
      </div>
    </form>
    <p id="searchStatus" class="small text-secondary" aria-live="polite"></p>
    <div id="searchResults" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4"></div>
  </main>

  <footer class="py-4 text-center bg-black border-top border-secondary-subtle">
    <small class="text-secondary">&copy; 2026 LayarKu Kelompok 7</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script>
    const films = [
      { title: "Miracle in Cell No. 7", poster: "poster2.jpeg", details: "Drama, komedi | 2022 | 2j 25m"},
      { title: "Laskar Pelangi", poster: "poster3.jpeg", details: "Drama, keluarga | 2008 | 2j 04m" },
      { title: "Avengers: Endgame", poster: "poster4.jpeg", details: "Aksi, petualangan, fiksi ilmiah | 2019 | 3j 01m" },
      { title: "Keluarga Cemara", poster: "poster5.jpeg", details: "Drama, keluarga | 2019 | 1j 50m" },
      { title: "Agak Laen", poster: "poster6.jpeg", details: "Komedi, horor | 2024 | 1j 59m" },
      { title: "Back to the Future", poster: "poster7.jpeg", details: "Fiksi ilmiah, petualangan, komedi | 1985 | 1j 56m" },
      { title: "Wicker", poster: "poster8.jpeg", details: "Drama, fantasi | Durasi belum diumumkan" },
      { title: "Street Fighter", poster: "poster9.jpeg", details: "Aksi, seni bela diri | Durasi belum diumumkan" },
      { title: "Wildwood", poster: "poster10.jpeg", details: "Animasi, fantasi, petualangan | Durasi belum diumumkan" },
      { title: "Clayface", poster: "poster11.jpeg", details: "Horor, superhero | Durasi belum diumumkan" },
      { title: "Harbin", poster: "poster14.jpeg", details: "Sejarah, aksi, thriller | 2024 | 1j 54m" },
      { title: "NID", poster: "poster15.jpeg", details: "Thriller, kriminal | Durasi belum diumumkan" },
      { title: "Heart of the Beast", poster: "poster16.jpeg", details: "Petualangan, thriller | Durasi belum diumumkan" },
      { title: "Pengabdi Setan", poster: "poster22.jpg", details: "Horor | 2017 | 1j 47m" },
      { title: "Parasite", poster: "poster23.jpeg", details: "Drama, thriller, komedi gelap | 2019 | 2j 12m" },
      { title: "Doctor X: Mafia in White", poster: "poster1.jpg", details: "Drama Medis | 2026 | Belum Diumumkan" },
      { title: "My Lovely Liar", poster: "poster13.jpeg", details: "Drama, Misteri, Romansa | 2023 | 16 Episode" },
      { title: "100 Days of Deception", poster: "poster12.jpeg", details: "Drama, Romansa | 2026 | Belum Diumumkan" },
      { title: "Stranger Things", poster: "poster17.jpg", details: "Drama, Sci-Fi, Misteri | 2016 | 5 Musim " },
      { title: "Wednesday", poster: "poster18.jpeg", details: "Drama, Misteri | 2021 | 3 Musim" }
    ];
    const keywordInput = document.getElementById("filmKeyword");
    const resultsContainer = document.getElementById("searchResults");
    const status = document.getElementById("searchStatus");
    document.getElementById("backButton").addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "index.html";
      }
    });
    keywordInput.value = new URLSearchParams(window.location.search).get("q") || "";

    function renderResults() {
      const query = keywordInput.value.trim().toLowerCase();
      const keywords = query.split(/\s+/).filter(Boolean);
      const matches = films.filter((film) => {
        const searchableText = `${film.title} ${film.details}`.toLowerCase();
        return keywords.every((keyword) => searchableText.includes(keyword));
      });

      resultsContainer.replaceChildren();
      matches.forEach((film) => {
        const column = document.createElement("div");
        column.className = "col";

        const card = document.createElement("article");
        card.className = "card h-100 overflow-hidden";

        const poster = document.createElement("img");
        poster.src = `img/${film.poster}`;
        poster.className = "card-img-top";
        poster.style.aspectRatio = "2 / 3";
        poster.style.objectFit = "cover";
        poster.alt = `Poster ${film.title}`;

        const posterLink = document.createElement("a");
        posterLink.href = "detail-film.html";
        posterLink.setAttribute("aria-label", `Lihat detail ${film.title}`);
        posterLink.append(poster);

        const cardBody = document.createElement("div");
        cardBody.className = "card-body";

        const title = document.createElement("h2");
        title.className = "h6 card-title";
        title.textContent = film.title;

        const details = document.createElement("p");
        details.className = "small text-secondary mb-0";
        details.textContent = film.details;

        cardBody.append(title, details);
        card.append(posterLink, cardBody);
        column.append(card);
        resultsContainer.append(column);
      });

      if (!query) {
        status.textContent = `Menampilkan semua ${matches.length} film.`;
      } else if (matches.length) {
        status.textContent = `Ditemukan ${matches.length} film.`;
      } else {
        status.textContent = "Tidak ada film yang cocok dengan kata kunci tersebut.";
      }
    }

    keywordInput.addEventListener("input", renderResults);
    renderResults();
  </script>
</body>

</html>
